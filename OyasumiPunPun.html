    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: #111;

    text-align: center;

  /* Volume card */
  .volume {
    margin: 1rem;
    background: #1b1b1b;
    border-radius: 12px;
    border: 1px solid #333;
    padding: 1rem;
    display: flex;
    align-items: center;

  .volume:hover {

  .volume-thumb {

  }

  .volume-title {

    font-weight: bold;
    color: #ff3b3b;
  }

  /* PDF Reader */
  #reader {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 100;
    flex-direction: column;
  }

  #pdf-canvas {
    width: 100%;
    flex: 1;
    background: #000;
  }

  #back-btn {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 20;
    padding: 8px 16px;
    background: #ff3b3b;
    color: white;
    border: none;
    border-radius: 6px;
  }

  .nav-zone {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 50%;
    z-index: 10;
  }
  #prev-zone { left: 0; }
  #next-zone { right: 0; }

  #page-info {
    position: absolute;
    bottom: 10px;
    right: 10px;
    padding: 6px 12px;
    background: rgba(255,0,0,0.5);
    border-radius: 6px;
  }
</style>

<!-- PDF Viewer -->
<div id="reader">
  <button id="back-btn" onclick="closePDF()">Back</button>
  <canvas id="pdf-canvas"></canvas>

  <div id="prev-zone" class="nav-zone" onclick="prevPage()"></div>
  <div id="next-zone" class="nav-zone" onclick="nextPage()"></div>

  <div id="page-info"></div>
</div>

<script>
let pdfDoc = null;
let pageNum = 1;

async function openPDF(pdfUrl) {
  document.getElementById("reader").style.display = "flex";

  const loadingTask = pdfjsLib.getDocument(pdfUrl);
  pdfDoc = await loadingTask.promise;

  pageNum = 1;
  renderPage(pageNum);
}

async function renderPage(num) {
  const page = await pdfDoc.getPage(num);
  const viewport = page.getViewport({ scale: 1.6 });

  const canvas = document.getElementById("pdf-canvas");
  const ctx = canvas.getContext("2d");

  canvas.height = viewport.height;
  canvas.width = viewport.width;

  await page.render({ canvasContext: ctx, viewport: viewport }).promise;

  document.getElementById("page-info").innerText =
    `Page ${num} / ${pdfDoc.numPages}`;
}

function prevPage() {
  if (pageNum <= 1) return;
  pageNum--;
  renderPage(pageNum);
}

function nextPage() {
  if (pageNum >= pdfDoc.numPages) return;
  pageNum++;
  renderPage(pageNum);
}

function closePDF() {
  document.getElementById("reader").style.display = "none";
}
</script>
